name: Release

on:
  push:
    tags: ['v*']

  # Lets a release be cut from the Actions tab without a terminal:
  # Run workflow -> type the version -> the tag is created here.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # PyInstaller does not cross-compile: a Windows EXE has to be built on
    # Windows. Everything below therefore runs in PowerShell.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Resolve version
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'.Trim() -replace '^v', ''
            if ($v -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version must look like 0.1.3 -- got '$v'"
            }
          } else {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "APP_VERSION=$v"     | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$v"    | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing v$v"

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Never move a tag that already exists: a published version has to
          # stay exactly what people already downloaded.
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($existing) {
            throw "$env:RELEASE_TAG already exists. Pick a higher version."
          }
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:RELEASE_TAG -m "Ninjito Translate $env:RELEASE_TAG"
          # Pushed with GITHUB_TOKEN, so this does NOT re-trigger the tag
          # trigger above -- GitHub suppresses workflow runs from events the
          # built-in token creates. Without that, this would build twice.
          git push origin $env:RELEASE_TAG

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.19.0

      - name: Install Tesseract OCR
        run: |
          choco install tesseract --no-progress -y
          # The whole point of the app is Russian -> English, and the
          # chocolatey package ships only eng/osd. build.py warns loudly
          # about this rather than failing, so fetch it explicitly.
          $tessdata = 'C:\Program Files\Tesseract-OCR\tessdata'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/tesseract-ocr/tessdata/raw/main/rus.traineddata' `
            -OutFile "$tessdata\rus.traineddata"

      - name: Build portable app
        # Produces dist/NinjitoTranslate/. The Whisper model is not bundled:
        # there is no models/ folder in a fresh checkout, so build.py skips
        # it and the app downloads it on first voice use. That keeps the
        # release asset in the hundreds of MB instead of ~1.8 GB.
        run: python build.py

      - name: Build Windows installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\NinjitoTranslate.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem installer\out

      - uses: softprops/action-gh-release@v2
        with:
          # Named explicitly so both triggers behave identically: on a tag
          # push this is the tag that fired, on a manual run it is the tag
          # created above.
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: installer/out/*.exe
