name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows-only by necessity, not preference: the suite exercises tkinter
    # windows and the Win32 keyboard hook, neither of which exists on Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # live_voice_check.py is a manual harness needing a real audio device
        # and a running Dota, so it is not part of the automated suite.
        run: python -m pytest tests/ -q --ignore=tests/live_voice_check.py
